baseURL = 'https://draftbench.io/'
languageCode = 'en-us'
title = 'Draft Bench'
theme = 'blowfish'

# Enable emoji rendering
enableEmoji = true

# Build settings
[build]
  noJSConfigInAssets = true

# HTML minifier — preserve attribute quotes so strict third-party
# validators (Bing Webmaster Tools, etc.) can parse our meta tags.
[minify.tdewolff.html]
  keepQuotes = true

# Google Analytics — Blowfish renders the gtag snippet from this ID,
# gated to production builds (hugo.IsProduction) so local dev never fires.
[services.googleAnalytics]
  ID = "G-2D54TKKRVX"

[params]
  # Site description — shown as the hero tagline and meta description
  description = "A writing workflow for Obsidian."

  # Site appearance
  colorScheme = "draft-bench"
  defaultAppearance = "light"
  autoSwitchAppearance = false

  # Homepage
  homepage.layout = "custom"
  homepage.showRecent = false

  # Social / OG
  defaultSocialImage = "img/social-card.png"

  # Logo and branding
  logo = "img/logo.svg"

  # Article settings
  article.showAuthor = false
  article.showDate = false
  article.showReadingTime = false
  article.showTableOfContents = true
  article.showPagination = false
  article.showBreadcrumbs = false

  # List settings
  list.showBreadcrumbs = false
  list.showTableOfContents = true

  # Global settings
  enableSearch = false
  enableCodeCopy = true

  # Footer
  footer.showCopyright = true
  footer.showThemeAttribution = false
  footer.showAppearanceSwitcher = false
  footer.showScrollToTop = true

[params.author]
  name = "banisterious"

# Main menu
[menu]
  [[menu.main]]
    name = "Features"
    pageRef = "features"
    weight = 5
  [[menu.main]]
    name = "FAQ"
    pageRef = "faq"
    weight = 10
  [[menu.main]]
    name = "Comparison"
    pageRef = "comparison"
    weight = 20
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/banisterious/obsidian-draft-bench"
    weight = 40
    [menu.main.params]
      icon = "github"

# Markup settings
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  # Auto-resolve relative .md links to their built page URL
  # (homepage links to comparison.md, etc.)
  [markup.goldmark.renderHooks.link]
    enableDefault = true

# Output formats for search
[outputs]
  home = ["HTML", "RSS", "JSON"]
